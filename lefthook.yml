# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/refs/heads/master/schema.json
#
output:
  - summary

pre-commit:
  parallel: true
  jobs:
    - name: Check Secret Leaks
      run: mise run ci:secret:check

    - name: Check formatting
      run: mise run ci:format:check

commit-msg:
  jobs:
    - name: conventional commits
      run: mise exec -- committed --commit-file {1}

pre-push:
  commands:
    ci:
      run: mise run ci

# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

includes:
  ci:
    taskfile: ./.taskfiles/ci.yml

tasks:
  default:
    cmd: task -l
    silent: true

  ci:
    silent: true
    cmds:
      - task: ci:run

  fmt:
    aliases: [format]
    silent: true
    cmd: dprint fmt

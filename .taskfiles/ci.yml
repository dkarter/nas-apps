# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

tasks:
  format:check:
    desc: Check formatting
    silent: true
    cmd: dprint check

  secret:check:
    desc: Check for secret leaks
    silent: true
    cmd: gitleaks git --pre-commit --redact --staged --verbose --no-banner

  run:
    desc: runs all CI commands
    cmds:
      - task format:check
